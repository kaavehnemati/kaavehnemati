<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" width="900" height="318" role="img" aria-label="About">
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .sum { font-size: 15px; fill: #768191; }
    .b { font-weight: 700; fill: #4F74BA; }
    .label { font-size: 11px; font-weight: 700; fill: #B07152; letter-spacing: 1.5px; }
    .name { font-size: 15px; font-weight: 700; fill: #4F74BA; letter-spacing: .4px; }
    .meta { font-size: 13.5px; fill: #8B95A5; }
    .item { font-size: 15px; fill: #768191; }
    .fade { animation: fade .8s ease-out both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .45s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>
  <defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B07152"/><stop offset="1" stop-color="#4A6FB5"/></linearGradient></defs>
  <g class="fade">
  <text class="sum" x="4" y="22">Software Engineer with hands-on experience designing, building, deploying and maintaining production</text>
  <text class="sum" x="4" y="46">backend systems. I work across <tspan class="b">PHP/Laravel</tspan> and <tspan class="b">Python/FastAPI</tspan> with <tspan class="b">PostgreSQL</tspan> and <tspan class="b">MySQL</tspan>, owning</text>
  <text class="sum" x="4" y="70">features end to end, from API design and data modeling to deployment, monitoring and troubleshooting.</text>
  </g>
  <g class="fade d2">
  <rect x="4" y="96" width="340" height="218" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="18" y="96" width="312" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="label" x="24" y="126">CURRENTLY</text>
  <text class="name" x="24" y="152">PAYSTAR</text>
  <text class="meta" x="24" y="171">Software Engineer · Full-time</text>
  <text class="name" x="24" y="198">AVINA IT SOLUTIONS</text>
  <text class="meta" x="24" y="217">Software Engineer · Part-time</text>
  <text class="label" x="24" y="250">EDUCATION</text>
  <text class="name" x="24" y="276">B.Sc. Computer Engineering</text>
  <text class="meta" x="24" y="295">University of Guilan · 2020–2024</text>
  </g>
  <g class="fade d3">
  <rect x="356" y="96" width="540" height="218" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="370" y="96" width="512" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="label" x="376" y="126">FOCUS AREAS</text>
  <circle cx="381" cy="151" r="3.5" fill="#B07152"/>
  <text class="item" x="394" y="156">Reliable, maintainable backend services and clean API design</text>
  <circle cx="381" cy="183" r="3.5" fill="#B07152"/>
  <text class="item" x="394" y="188">Service integrations, authentication and authorization</text>
  <circle cx="381" cy="215" r="3.5" fill="#B07152"/>
  <text class="item" x="394" y="220">Database design, data modeling and query performance</text>
  <circle cx="381" cy="247" r="3.5" fill="#B07152"/>
  <text class="item" x="394" y="252">Stable releases, production environments and troubleshooting</text>
  <circle cx="381" cy="279" r="3.5" fill="#B07152"/>
  <text class="item" x="394" y="284">AI-assisted engineering with Claude Code and OpenAI Codex</text>
  </g>
</svg>
