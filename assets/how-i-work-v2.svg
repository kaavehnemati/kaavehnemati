<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="How I work">
  <style>
    text  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .num  { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .title{ font-size: 18px; font-weight: 700; fill: #093060; }
    .desc { font-size: 14px; fill: #3D4A5C; }
    .tile { animation: fade .8s ease-out both; }
    .t2 { animation-delay: .15s; } .t3 { animation-delay: .3s; } .t4 { animation-delay: .45s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .tile { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="900" height="290" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="290" fill="#EEF2F3"/>
    <rect width="900" height="8" fill="#093060"/>
  </g>
  <line x1="40" y1="153" x2="860" y2="153" stroke="#C58B67" stroke-width="1.5"/>
  <line x1="450" y1="48" x2="450" y2="262" stroke="#C9D3DC" stroke-width="2"/>

  <g class="tile t1">
    <circle cx="60" cy="68" r="20" fill="#093060"/>
    <text class="num" x="60" y="73" text-anchor="middle">01</text>
    <text class="title" x="96" y="74">Production first</text>
    <text class="desc" x="96" y="100">I deploy, monitor and troubleshoot what I ship,</text>
    <text class="desc" x="96" y="122">and stay responsible for it after release.</text>
  </g>

  <g class="tile t2">
    <circle cx="490" cy="68" r="20" fill="#093060"/>
    <text class="num" x="490" y="73" text-anchor="middle">02</text>
    <text class="title" x="526" y="74">Simple over clever</text>
    <text class="desc" x="526" y="100">Readable, well-structured code built on SOLID</text>
    <text class="desc" x="526" y="122">principles, so the next change is a safe one.</text>
  </g>

  <g class="tile t3">
    <circle cx="60" cy="198" r="20" fill="#093060"/>
    <text class="num" x="60" y="203" text-anchor="middle">03</text>
    <text class="title" x="96" y="204">Data done right</text>
    <text class="desc" x="96" y="230">Careful schemas, sensible indexes and fast</text>
    <text class="desc" x="96" y="252">queries are the base of every reliable service.</text>
  </g>

  <g class="tile t4">
    <circle cx="490" cy="198" r="20" fill="#093060"/>
    <text class="num" x="490" y="203" text-anchor="middle">04</text>
    <text class="title" x="526" y="204">AI as a teammate</text>
    <text class="desc" x="526" y="230">Claude Code and Codex speed up building and</text>
    <text class="desc" x="526" y="252">debugging; I still review every change myself.</text>
  </g>
</svg>
