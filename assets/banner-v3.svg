<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Kaveh Nemati, Software Engineer, Rasht, Iran. Building backend systems with Laravel and FastAPI">
  <style>
    .back  { animation: drift 14s linear infinite reverse; }
    .front { animation: drift 10s linear infinite; }
