  <text x="600" y="128" text-anchor="middle" fill="#DCE3F0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600">Software Engineer · Rasht, Iran</text>
  <text x="600" y="164" text-anchor="middle" fill="#E2B394" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">Building backend systems with Laravel &amp; FastAPI</text>
