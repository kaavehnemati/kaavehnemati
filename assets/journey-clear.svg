<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 868" width="900" height="868" role="img" aria-label="Career timeline">
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .initial { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .company { font-size: 18px; font-weight: 700; fill: #4F74BA; letter-spacing: .6px; }
    .cmeta { font-size: 13.5px; font-weight: 400; fill: #8B95A5; letter-spacing: 0; }
    .role { font-size: 16px; font-weight: 700; fill: #4F74BA; }
    .tag { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
    .meta { font-size: 13.5px; fill: #8B95A5; }
    .chip { font-size: 12px; font-weight: 600; fill: #4F74BA; }
    .desc { font-size: 15px; fill: #768191; }
    .fade { animation: fade .8s ease-out both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .45s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>
  <defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B07152"/><stop offset="1" stop-color="#4A6FB5"/></linearGradient></defs>
  <line x1="24" y1="50" x2="24" y2="202" stroke="#8B95A5" stroke-opacity=".5" stroke-width="3"/>
  <line x1="24" y1="254" x2="24" y2="542" stroke="#8B95A5" stroke-opacity=".5" stroke-width="3"/>
  <g class="fade d1">
  <circle cx="24" cy="24" r="20" fill="#22468A"/>
  <text class="initial" x="24" y="30" text-anchor="middle">P</text>
  <text class="company" x="62" y="30">PAYSTAR<tspan class="cmeta" dx="14">Rasht, Iran · On-site</tspan></text>
  <rect x="62" y="58" width="834" height="124" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="76" y="58" width="806" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="role" x="82" y="92">Software Engineer</text>
  <rect x="722.4" y="76" width="153.6" height="22" rx="11.0" fill="#4A6FB5" fill-opacity=".15"/><text class="chip" x="799.2" y="91.2" text-anchor="middle">Nov 2025 – Present</text>
  <rect x="82.0" y="103" width="72.0" height="19" rx="9.5" fill="#B07152"/><text class="tag" x="118.0" y="116.7" text-anchor="middle">CURRENT</text>
  <text class="meta" x="164" y="117">Full-time</text>
  <text class="desc" x="82" y="146">Building and running production backend services: RESTful APIs, service integrations,</text>
  <text class="desc" x="82" y="167">deployment, server configuration, monitoring and production troubleshooting.</text>
  </g>
  <g class="fade d2">
  <circle cx="24" cy="228" r="20" fill="#22468A"/>
  <text class="initial" x="24" y="234" text-anchor="middle">A</text>
  <text class="company" x="62" y="234">AVINA IT SOLUTIONS<tspan class="cmeta" dx="14">Tehran, Iran · Remote</tspan></text>
  <rect x="62" y="262" width="834" height="124" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="76" y="262" width="806" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="role" x="82" y="296">Software Engineer</text>
  <rect x="722.4" y="280" width="153.6" height="22" rx="11.0" fill="#4A6FB5" fill-opacity=".15"/><text class="chip" x="799.2" y="295.2" text-anchor="middle">Oct 2025 – Present</text>
  <rect x="82.0" y="307" width="72.0" height="19" rx="9.5" fill="#B07152"/><text class="tag" x="118.0" y="320.7" text-anchor="middle">CURRENT</text>
  <text class="meta" x="164" y="321">Part-time</text>
  <text class="desc" x="82" y="350">Backend features and service integrations across PHP/Laravel and Python/FastAPI projects,</text>
  <text class="desc" x="82" y="371">plus refactoring, deployment workflows and release management.</text>
  <rect x="62" y="398" width="834" height="124" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="76" y="398" width="806" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="role" x="82" y="432">Back-end Developer</text>
  <rect x="715.2" y="416" width="160.8" height="22" rx="11.0" fill="#4A6FB5" fill-opacity=".15"/><text class="chip" x="795.6" y="431.2" text-anchor="middle">Feb 2025 – Oct 2025</text>
  <text class="meta" x="82" y="457">Full-time · 9 mos</text>
  <text class="desc" x="82" y="486">RESTful APIs, authentication and authorization, business logic and third-party integrations;</text>
  <text class="desc" x="82" y="507">query optimization, debugging and refactoring through Git-based code reviews.</text>
  </g>
  <g class="fade d3">
  <circle cx="24" cy="568" r="20" fill="#22468A"/>
  <text class="initial" x="24" y="574" text-anchor="middle">P</text>
  <text class="company" x="62" y="574">PARDIS TECHNOLOGY PARK<tspan class="cmeta" dx="14">Tehran, Iran · Remote</tspan></text>
  <rect x="62" y="602" width="834" height="124" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="76" y="602" width="806" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="role" x="82" y="636">Quality Assurance Engineer</text>
  <rect x="715.2" y="620" width="160.8" height="22" rx="11.0" fill="#4A6FB5" fill-opacity=".15"/><text class="chip" x="795.6" y="635.2" text-anchor="middle">Apr 2024 – Jan 2025</text>
  <text class="meta" x="82" y="661">Full-time · 10 mos</text>
  <text class="desc" x="82" y="690">Functional, API, regression and automated testing of web applications with Cypress,</text>
  <text class="desc" x="82" y="711">plus reproducible bug reports and fix validation with developers.</text>
  <rect x="62" y="738" width="834" height="124" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="76" y="738" width="806" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="role" x="82" y="772">Software Engineer Intern</text>
  <rect x="715.2" y="756" width="160.8" height="22" rx="11.0" fill="#4A6FB5" fill-opacity=".15"/><text class="chip" x="795.6" y="771.2" text-anchor="middle">Feb 2024 – Apr 2024</text>
  <text class="meta" x="82" y="797">Full-time · 3 mos</text>
  <text class="desc" x="82" y="826">Backend development with PHP, Laravel and MySQL: REST APIs, database operations,</text>
  <text class="desc" x="82" y="847">application logic, authentication and bug fixing.</text>
  </g>
</svg>
