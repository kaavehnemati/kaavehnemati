<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 916" width="900" height="916" role="img" aria-label="Career timeline">
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .initial { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
    .company { font-size: 18px; font-weight: 700; fill: #E6EDF3; letter-spacing: .6px; }
    .cmeta { font-size: 13px; font-weight: 400; fill: #8E9BB0; letter-spacing: 0; }
    .role { font-size: 16px; font-weight: 700; fill: #E6EDF3; }
    .tag { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
    .meta { font-size: 13px; fill: #8E9BB0; }
    .chip { font-size: 12px; font-weight: 600; fill: #D6E2F3; }
    .desc { font-size: 14px; fill: #B9C4D3; }
    .fade { animation: fade .8s ease-out both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .45s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>
  <rect width="900" height="916" rx="12" fill="#131C2B"/>
  <line x1="56" y1="58" x2="56" y2="598" stroke="#3D63A8" stroke-width="3"/>
  <g class="fade d1">
  <circle cx="56" cy="58" r="22" fill="#22468A" stroke="#131C2B" stroke-width="4"/>
  <text class="initial" x="56" y="64.5" text-anchor="middle">P</text>
  <text class="company" x="96" y="64">PAYSTAR<tspan class="cmeta" dx="14">Rasht, Iran · On-site</tspan></text>
  <rect x="96" y="92" width="772" height="120" rx="10" fill="#1A2638" stroke="#2B3A52"/>
  <text class="role" x="116" y="124">Software Engineer</text>
  <rect x="694.4" y="108" width="153.6" height="22" rx="11.0" fill="#22344F"/><text class="chip" x="771.2" y="123.2" text-anchor="middle">Nov 2025 – Present</text>
  <rect x="116.0" y="135" width="72.0" height="19" rx="9.5" fill="#B07152"/><text class="tag" x="152.0" y="148.7" text-anchor="middle">CURRENT</text>
  <text class="meta" x="198" y="149">Full-time</text>
  <text class="desc" x="116" y="178">Building and running production backend services: RESTful APIs, service integrations,</text>
  <text class="desc" x="116" y="198">deployment, server configuration, monitoring and production troubleshooting.</text>
  </g>
  <g class="fade d2">
  <circle cx="56" cy="262" r="22" fill="#22468A" stroke="#131C2B" stroke-width="4"/>
  <text class="initial" x="56" y="268.5" text-anchor="middle">A</text>
  <text class="company" x="96" y="268">AVINA IT SOLUTIONS<tspan class="cmeta" dx="14">Tehran, Iran · Remote</tspan></text>
  <rect x="96" y="296" width="772" height="120" rx="10" fill="#1A2638" stroke="#2B3A52"/>
  <text class="role" x="116" y="328">Software Engineer</text>
  <rect x="694.4" y="312" width="153.6" height="22" rx="11.0" fill="#22344F"/><text class="chip" x="771.2" y="327.2" text-anchor="middle">Oct 2025 – Present</text>
  <rect x="116.0" y="339" width="72.0" height="19" rx="9.5" fill="#B07152"/><text class="tag" x="152.0" y="352.7" text-anchor="middle">CURRENT</text>
  <text class="meta" x="198" y="353">Part-time</text>
  <text class="desc" x="116" y="382">Backend features and service integrations across PHP/Laravel and Python/FastAPI projects,</text>
  <text class="desc" x="116" y="402">plus refactoring, deployment workflows and release management.</text>
  <rect x="96" y="428" width="772" height="120" rx="10" fill="#1A2638" stroke="#2B3A52"/>
  <text class="role" x="116" y="460">Back-end Developer</text>
  <rect x="687.2" y="444" width="160.8" height="22" rx="11.0" fill="#22344F"/><text class="chip" x="767.6" y="459.2" text-anchor="middle">Feb 2025 – Oct 2025</text>
  <text class="meta" x="116" y="485">Full-time · 9 mos</text>
  <text class="desc" x="116" y="514">RESTful APIs, authentication and authorization, business logic and third-party integrations;</text>
  <text class="desc" x="116" y="534">query optimization, debugging and refactoring through Git-based code reviews.</text>
  </g>
  <g class="fade d3">
  <circle cx="56" cy="598" r="22" fill="#22468A" stroke="#131C2B" stroke-width="4"/>
  <text class="initial" x="56" y="604.5" text-anchor="middle">P</text>
  <text class="company" x="96" y="604">PARDIS TECHNOLOGY PARK<tspan class="cmeta" dx="14">Tehran, Iran · Remote</tspan></text>
  <rect x="96" y="632" width="772" height="120" rx="10" fill="#1A2638" stroke="#2B3A52"/>
  <text class="role" x="116" y="664">Quality Assurance Engineer</text>
  <rect x="687.2" y="648" width="160.8" height="22" rx="11.0" fill="#22344F"/><text class="chip" x="767.6" y="663.2" text-anchor="middle">Apr 2024 – Jan 2025</text>
  <text class="meta" x="116" y="689">Full-time · 10 mos</text>
  <text class="desc" x="116" y="718">Functional, API, regression and automated testing of web applications with Cypress,</text>
  <text class="desc" x="116" y="738">plus reproducible bug reports and fix validation with developers.</text>
  <rect x="96" y="764" width="772" height="120" rx="10" fill="#1A2638" stroke="#2B3A52"/>
  <text class="role" x="116" y="796">Software Engineer Intern</text>
  <rect x="687.2" y="780" width="160.8" height="22" rx="11.0" fill="#22344F"/><text class="chip" x="767.6" y="795.2" text-anchor="middle">Feb 2024 – Apr 2024</text>
  <text class="meta" x="116" y="821">Full-time · 3 mos</text>
  <text class="desc" x="116" y="850">Backend development with PHP, Laravel and MySQL: REST APIs, database operations,</text>
  <text class="desc" x="116" y="870">application logic, authentication and bug fixing.</text>
  </g>
</svg>
