<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="presentation">
  <style>
    .back  { animation: drift 14s linear infinite reverse; }
    .front { animation: drift 10s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @media (prefers-reduced-motion: reduce) { .back, .front { animation: none; } }
  </style>
  <path class="back" fill="#22468A" d="M0 80 V20 Q150 32 300 20 T600 20 T900 20 T1200 20 T1500 20 T1800 20 T2100 20 T2400 20 V80 Z"/>
  <path class="front" fill="#093060" d="M0 80 V32 Q150 16 300 32 T600 32 T900 32 T1200 32 T1500 32 T1800 32 T2100 32 T2400 32 V80 Z"/>
</svg>
