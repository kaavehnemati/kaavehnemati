<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="How I work">
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .num { font-size: 28px; font-weight: 700; fill: #B07152; }
    .title { font-size: 18px; font-weight: 700; fill: #093060; }
    .desc { font-size: 14px; fill: #3D4A5C; }
    .fade { animation: fade .8s ease-out both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .45s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>
  <rect width="900" height="280" rx="12" fill="#EEF2F3"/>
  <line x1="40" y1="145" x2="860" y2="145" stroke="#D3DCE6" stroke-width="2"/>
  <line x1="450" y1="40" x2="450" y2="250" stroke="#D3DCE6" stroke-width="2"/>
  <g class="fade d1">
  <text class="num" x="40" y="70">01</text>
  <text class="title" x="96" y="64">Production first</text>
  <text class="desc" x="96" y="90">I deploy, monitor and troubleshoot what I ship,</text>
  <text class="desc" x="96" y="112">and stay responsible for it after release.</text>
  </g>
  <g class="fade d2">
  <text class="num" x="470" y="70">02</text>
  <text class="title" x="526" y="64">Simple over clever</text>
  <text class="desc" x="526" y="90">Readable, well-structured code built on SOLID</text>
  <text class="desc" x="526" y="112">principles, so the next change is a safe one.</text>
  </g>
  <g class="fade d3">
  <text class="num" x="40" y="200">03</text>
  <text class="title" x="96" y="194">Data done right</text>
  <text class="desc" x="96" y="220">Careful schemas, sensible indexes and fast</text>
  <text class="desc" x="96" y="242">queries are the base of every reliable service.</text>
  </g>
  <g class="fade d4">
  <text class="num" x="470" y="200">04</text>
  <text class="title" x="526" y="194">AI as a teammate</text>
  <text class="desc" x="526" y="220">Claude Code and Codex speed up building and</text>
  <text class="desc" x="526" y="242">debugging; I still review every change myself.</text>
  </g>
</svg>
