<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="How I work">
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .num { font-size: 28px; font-weight: 700; fill: #B07152; }
    .title { font-size: 18px; font-weight: 700; fill: #4F74BA; }
    .desc { font-size: 14.5px; fill: #768191; }
    .fade { animation: fade .8s ease-out both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .45s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>
  <defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B07152"/><stop offset="1" stop-color="#4A6FB5"/></linearGradient></defs>
  <g class="fade d1">
  <rect x="4" y="4" width="438" height="118" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="18" y="4" width="410" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="num" x="24" y="52">01</text>
  <text class="title" x="76" y="44">Production first</text>
  <text class="desc" x="76" y="70">I deploy, monitor and troubleshoot what I ship,</text>
  <text class="desc" x="76" y="92">and stay responsible for it after release.</text>
  </g>
  <g class="fade d2">
  <rect x="458" y="4" width="438" height="118" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="472" y="4" width="410" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="num" x="478" y="52">02</text>
  <text class="title" x="530" y="44">Simple over clever</text>
  <text class="desc" x="530" y="70">Readable, well-structured code built on SOLID</text>
  <text class="desc" x="530" y="92">principles, so the next change is a safe one.</text>
  </g>
  <g class="fade d3">
  <rect x="4" y="138" width="438" height="118" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="18" y="138" width="410" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="num" x="24" y="186">03</text>
  <text class="title" x="76" y="178">Data done right</text>
  <text class="desc" x="76" y="204">Careful schemas, sensible indexes and fast</text>
  <text class="desc" x="76" y="226">queries are the base of every reliable service.</text>
  </g>
  <g class="fade d4">
  <rect x="458" y="138" width="438" height="118" rx="10" fill="#8B95A5" fill-opacity=".08" stroke="#8B95A5" stroke-opacity=".35"/>
  <rect x="472" y="138" width="410" height="2" rx="1" fill="url(#hl)" opacity=".85"/>
  <text class="num" x="478" y="186">04</text>
  <text class="title" x="530" y="178">AI as a teammate</text>
  <text class="desc" x="530" y="204">Claude Code and Codex speed up building and</text>
  <text class="desc" x="530" y="226">debugging; I still review every change myself.</text>
  </g>
</svg>
